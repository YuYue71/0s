<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 設計基礎教學 - 平面UI設計完全指南</title>
    <!-- 引入 Lucide 圖標庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0a0a0a;
            --bg-accent: #111111;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-hover: rgba(255, 255, 255, 0.06);
            --border-color: rgba(255, 255, 255, 0.1);
            --border-hover: rgba(255, 255, 255, 0.2);
            --accent-red: #ff4d4d;
            --accent-green: #00e676;
            --accent-blue: #4d7fff;
            --accent-yellow: #ffd700;
            --text-main: #ffffff;
            --text-secondary: #cccccc;
            --text-dim: #888888;
            --shadow-light: 0 0 20px rgba(0,0,0,0.5);
            --shadow-medium: 0 8px 32px rgba(0,0,0,0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ===== 頁頭區域 ===== */
        .header {
            padding: 60px 40px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(135deg, rgba(255,77,77,0.05) 0%, rgba(77,127,255,0.05) 100%);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,77,77,0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff4d4d, #4d7fff, #00e676);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInDown 0.8s ease-out;
        }

        .header p {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-bottom: 20px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        /* ===== 主容器與段落 ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .section {
            margin-bottom: 80px;
            animation: fadeIn 0.8s ease-out;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 40px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 16px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
        }

        .section-title i {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        /* ===== 流程圖區域 ===== */
        .flow-container {
            display: flex;
            gap: 20px;
            align-items: stretch;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
            position: relative;
        }

        .flow-item {
            display: flex;
            gap: 20px;
            align-items: center;
            flex: 1;
            min-width: 300px;
            max-width: 500px;
        }

        .flow-spacer {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
        }

        /* ===== 卡片組件 ===== */
        .layer-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 28px;
            position: relative;
            min-width: 280px;
            box-shadow: var(--shadow-light);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .layer-box:hover {
            background: var(--card-hover);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-medium);
            transform: translateY(-4px);
        }

        .layer-box.problem-layer {
            border-top: 3px solid var(--accent-red);
        }

        .layer-box.problem-layer:hover {
            box-shadow: 0 0 30px rgba(255, 77, 77, 0.2);
        }

        .layer-box.solution-layer {
            border-top: 3px solid var(--accent-green);
        }

        .layer-box.solution-layer:hover {
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.2);
        }

        .layer-box.principle-layer {
            border-top: 3px solid var(--accent-blue);
        }

        .layer-box.principle-layer:hover {
            box-shadow: 0 0 30px rgba(77, 127, 255, 0.2);
        }

        .layer-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .layer-title i {
            width: 18px;
            height: 18px;
        }

        /* ===== 內容節點 ===== */
        .content-node {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .content-node:last-child {
            margin-bottom: 0;
        }

        .content-node:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--border-hover);
        }

        .content-node.highlighted {
            background: rgba(255, 77, 77, 0.1);
            border-color: rgba(255, 77, 77, 0.3);
        }

        .content-node.highlighted:hover {
            background: rgba(255, 77, 77, 0.15);
            border-color: var(--accent-red);
        }

        .content-node h4 {
            margin: 12px 0 6px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .content-node p {
            font-size: 0.85rem;
            color: var(--text-dim);
            line-height: 1.4;
        }

        .content-node svg {
            display: inline-block;
            margin-bottom: 8px;
        }

        /* ===== 輸入/輸出節點 ===== */
        .io-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            min-width: 140px;
            transition: all 0.3s ease;
        }

        .io-node:hover {
            background: var(--card-hover);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .io-node i {
            font-size: 1.8rem;
        }

        .io-node-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
        }

        /* ===== 動態流動箭頭 ===== */
        .arrow-svg {
            width: 80px;
            height: 40px;
            overflow: visible;
            flex-shrink: 0;
        }

        .arrow-svg-vertical {
            width: 40px;
            height: 80px;
            overflow: visible;
            flex-shrink: 0;
        }

        .flow-line {
            fill: none;
            stroke: var(--text-dim);
            stroke-width: 2;
            stroke-dasharray: 6, 4;
            animation: flow 1.5s linear infinite;
        }

        .flow-line.red {
            stroke: var(--accent-red);
        }

        .flow-line.green {
            stroke: var(--accent-green);
        }

        .flow-line.blue {
            stroke: var(--accent-blue);
        }

        .flow-arrow {
            fill: var(--text-dim);
        }

        .flow-arrow.red {
            fill: var(--accent-red);
        }

        .flow-arrow.green {
            fill: var(--accent-green);
        }

        .flow-arrow.blue {
            fill: var(--accent-blue);
        }

        @keyframes flow {
            from { stroke-dashoffset: 20; }
            to { stroke-dashoffset: 0; }
        }

        /* ===== 特性網格 ===== */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .feature-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .feature-card:hover {
            background: var(--card-hover);
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-medium);
        }

        .feature-card i {
            font-size: 2rem;
            margin-bottom: 12px;
            display: block;
        }

        .feature-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .feature-card p {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        /* ===== 對比區塊 ===== */
        .comparison-block {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .comparison-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .comparison-item.before {
            border-left: 3px solid var(--accent-red);
        }

        .comparison-item.before:hover {
            box-shadow: 0 0 30px rgba(255, 77, 77, 0.15);
        }

        .comparison-item.after {
            border-left: 3px solid var(--accent-green);
        }

        .comparison-item.after:hover {
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.15);
        }

        .comparison-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .comparison-content {
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .comparison-content li {
            margin-bottom: 8px;
            margin-left: 20px;
        }

        /* ===== 頁腳 ===== */
        .footer {
            border-top: 1px solid var(--border-color);
            padding: 40px;
            text-align: center;
            color: var(--text-dim);
            background: var(--bg-accent);
            margin-top: 80px;
        }

        .footer p {
            margin-bottom: 8px;
        }

        /* ===== 動畫定義 ===== */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ===== 響應式設計 ===== */
        @media (max-width: 1024px) {
            .flow-container {
                flex-direction: column;
                gap: 30px;
            }

            .flow-item {
                max-width: 100%;
            }

            .flow-spacer {
                width: 40px;
                height: 40px;
            }

            .arrow-svg {
                transform: rotate(90deg);
                width: 40px;
                height: 80px;
            }

            .comparison-block {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 40px 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .container {
                padding: 20px;
            }

            .section-title {
                font-size: 1.6rem;
            }

            .layer-box {
                min-width: 100%;
            }

            .features-grid {
                grid-template-columns: 1fr;
            }

            .comparison-block {
                grid-template-columns: 1fr;
            }
        }

        /* ===== 滾動條美化 ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }
    </style>
</head>
<body>

    <!-- ===== 頁頭 ===== -->
    <header class="header">
        <h1>Web 設計基礎教學</h1>
        <p>從零開始掌握平面 UI 設計的核心原則與實踐方法</p>
        <div class="header-badge">
            <i data-lucide="zap" style="color: var(--accent-yellow);"></i>
            完整教學指南 | 平面 UI 設計實戰課程
        </div>
    </header>

    <!-- ===== 主容器 ===== -->
    <div class="container">

        <!-- ===== 第一章：設計基礎流程 ===== -->
        <section class="section">
            <h2 class="section-title">
                <i data-lucide="layout-grid"></i>
                第一章：設計的基礎流程
            </h2>

            <div class="flow-container">
                <!-- 輸入 -->
                <div class="io-node">
                    <i data-lucide="smartphone" style="color: var(--accent-blue);"></i>
                    <span class="io-node-label">用戶需求</span>
                </div>

                <!-- 箭頭 -->
                <div class="flow-spacer">
                    <svg class="arrow-svg">
                        <path d="M0,20 L70,20" class="flow-line blue" />
                        <polygon points="70,15 80,20 70,25" class="flow-arrow blue" />
                    </svg>
                </div>

                <!-- 問題分析層 -->
                <div class="layer-box problem-layer">
                    <div class="layer-title">
                        <i data-lucide="alert-circle"></i> 分析階段
                    </div>
                    <div class="content-node highlighted">
                        <i data-lucide="search"></i>
                        <h4>深入調研</h4>
                        <p>理解用戶痛點與產品需求</p>
                    </div>
                    <div class="content-node">
                        <i data-lucide="compass"></i>
                        <h4>明確方向</h4>
                        <p>定義設計目標與成功指標</p>
                    </div>
                </div>

                <!-- 箭頭 -->
                <div class="flow-spacer">
                    <svg class="arrow-svg">
                        <path d="M0,20 L70,20" class="flow-line" />
                        <polygon points="70,15 80,20 70,25" class="flow-arrow" />
                    </svg>
                </div>

                <!-- 設計方案層 -->
                <div class="layer-box solution-layer">
                    <div class="layer-title">
                        <i data-lucide="check-circle"></i> 實施階段
                    </div>
                    <div class="content-node">
                        <i data-lucide="pencil"></i>
                        <h4>快速設計</h4>
                        <p>繪製線框圖與原型</p>
                    </div>
                    <div class="content-node">
                        <i data-lucide="palette"></i>
                        <h4>視覺優化</h4>
                        <p>建立完整的設計系統</p>
                    </div>
                </div>

                <!-- 箭頭 -->
                <div class="flow-spacer">
                    <svg class="arrow-svg">
                        <path d="M0,20 L70,20" class="flow-line green" />
                        <polygon points="70,15 80,20 70,25" class="flow-arrow green" />
                    </svg>
                </div>

                <!-- 輸出 -->
                <div class="io-node">
                    <i data-lucide="check" style="color: var(--accent-green);"></i>
                    <span class="io-node-label">高保真成品</span>
                </div>
            </div>
        </section>

        <!-- ===== 第二章：色彩系統 ===== -->
        <section class="section">
            <h2 class="section-title">
                <i data-lucide="palette"></i>
                第二章：色彩系統設計
            </h2>

            <p style="color: var(--text-secondary); margin-bottom: 30px;">
                色彩是設計中最具表現力的工具。一個精心設計的色彩系統能提升用戶體驗並強化品牌認同。
            </p>

            <div class="features-grid">
                <div class="feature-card">
                    <i data-lucide="circle" style="color: var(--accent-red);"></i>
                    <h3>主色調</h3>
                    <p>代表品牌核心特性的色彩，用於按鈕、標題等關鍵元素</p>
                </div>
                <div class="feature-card">
                    <i data-lucide="circle" style="color: var(--accent-green);"></i>
                    <h3>輔助色</h3>
                    <p>配合主色調的補充色彩，用於強調積極或成功狀態</p>
                </div>
                <div class="feature-card">
                    <i data-lucide="circle" style="color: var(--accent
