<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 展示教學模板</title>
    <!-- 引入 Lucide 圖標庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-red: #ff4d4d;
            --accent-green: #00e676;
            --text-main: #ffffff;
            --text-dim: #888888;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 佈局容器 */
        .container {
            display: flex;
            gap: 60px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 1200px;
            width: 100%;
        }

        /* 卡片組件 - 精確還原平面UI樣式 */
        .layer-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            position: relative;
            min-width: 280px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .layer-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content-node {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .content-node:hover {
            transform: translateY(-2px);
            border-color: var(--accent-red);
        }

        /* 動態流動箭頭 SVG */
        .arrow-svg {
            width: 100px;
            height: 40px;
            overflow: visible;
        }

        .flow-line {
            fill: none;
            stroke: var(--text-dim);
            stroke-width: 2;
            stroke-dasharray: 6, 4;
            animation: flow 1s linear infinite;
        }

        @keyframes flow {
            from { stroke-dashoffset: 20; }
            to { stroke-dashoffset: 0; }
        }

        /* 響應式優化 */
        @media (max-width: 768px) {
            .container { flex-direction: column; gap: 40px; }
            .arrow-svg { transform: rotate(90deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 節點 1 -->
        <div class="node-unit">
            <i data-lucide="smartphone" style="color: var(--accent-red); margin-bottom: 10px;"></i>
            <div style="font-size: 0.9rem;">Input Data</div>
        </div>

        <!-- 流動箭頭 -->
        <svg class="arrow-svg">
            <path d="M0,20 L90,20" class="flow-line" />
            <polygon points="90,15 100,20 90,25" fill="#888" />
        </svg>

        <!-- 區塊層 1 -->
        <div class="layer-box" style="border-top: 2px solid var(--accent-red);">
            <div class="layer-title">
                <i data-lucide="alert-triangle" size="14"></i> PROBLEM LAYER
            </div>
            <div class="content-node">
                <i data-lucide="zap" color="#ff4d4d"></i>
                <h4 style="margin: 8px 0;">梯度消失</h4>
                <p style="font-size: 0.8rem; color: var(--text-dim);">早期信息梯度指數級衰減</p>
            </div>
            <div class="content-node">
                <i data-lucide="clock" color="#ff4d4d"></i>
                <h4 style="margin: 8px 0;">記憶丟失</h4>
                <p style="font-size: 0.8rem; color: var(--text-dim);">長序列開頭信息被遺忘</p>
            </div>
        </div>

        <!-- 流動箭頭 -->
        <svg class="arrow-svg">
            <path d="M0,20 L90,20" class="flow-line" />
            <polygon points="90,15 100,20 90,25" fill="#888" />
        </svg>

        <!-- 區塊層 2 -->
        <div class="layer-box" style="border-top: 2px solid var(--accent-green);">
            <div class="layer-title">
                <i data-lucide="check-circle" size="14"></i> SOLUTION LAYER
            </div>
            <div class="content-node" style="border-color: rgba(0, 230, 118, 0.3);">
                <i data-lucide="lock" color="#00e676"></i>
                <h4 style="margin: 8px 0;">LSTM 1997</h4>
                <p style="font-size: 0.8rem; color: var(--text-dim);">門控機制保護長期記憶</p>
            </div>
        </div>
    </div>

    <script>
        // 初始化 Lucide 圖標
        lucide.createIcons();
    </script>
</body>
</html>
